<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">Isaac Sim startup flow</title>
  <desc id="desc">Startup flow for rebuilding the Limo scene, importing a realistic Isaac Sim environment, enabling ROS 2 control, and publishing camera images.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#243447"/>
    </marker>
    <style>
      .bg { fill: #f7f9fb; }
      .box { fill: #ffffff; stroke: #25364a; stroke-width: 2; rx: 10; }
      .env { fill: #edf7ff; stroke: #1668a8; stroke-width: 2; rx: 10; }
      .ros { fill: #f2fff5; stroke: #247a3d; stroke-width: 2; rx: 10; }
      .camera { fill: #f6f1ff; stroke: #6b45a8; stroke-width: 2; rx: 10; }
      .run { fill: #fff7ed; stroke: #a45711; stroke-width: 2; rx: 10; }
      .line { stroke: #243447; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .label { font: 600 18px Arial, sans-serif; fill: #182536; }
      .small { font: 14px Arial, sans-serif; fill: #31465d; }
      .title { font: 700 25px Arial, sans-serif; fill: #182536; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1180" height="520"/>
  <text class="title" x="40" y="44">auto_start_limo_uninavid.py startup sequence</text>

  <rect class="box" x="55" y="92" width="245" height="82"/>
  <text class="label" x="83" y="126">Start Isaac Sim</text>
  <text class="small" x="83" y="152">--exec auto_start_limo_uninavid.py</text>

  <rect class="box" x="370" y="92" width="245" height="82"/>
  <text class="label" x="405" y="126">Load Limo USD</text>
  <text class="small" x="405" y="152">limo_base.usd is reopened</text>

  <rect class="box" x="685" y="92" width="245" height="82"/>
  <text class="label" x="720" y="126">Reset Limo pose</text>
  <text class="small" x="720" y="152">/limo_xacro at origin</text>

  <rect class="env" x="55" y="246" width="245" height="96"/>
  <text class="label" x="84" y="282">Import environment</text>
  <text class="small" x="84" y="309">Simple Warehouse preferred</text>
  <text class="small" x="84" y="331">fallback room if unavailable</text>

  <rect class="env" x="370" y="246" width="245" height="96"/>
  <text class="label" x="412" y="282">Add target props</text>
  <text class="small" x="412" y="309">brown table / green chair</text>
  <text class="small" x="412" y="331">red marker for navigation</text>

  <rect class="ros" x="685" y="246" width="245" height="96"/>
  <text class="label" x="718" y="282">Enable ROS 2 control</text>
  <text class="small" x="718" y="309">/cmd_vel subscriber</text>
  <text class="small" x="718" y="331">kinematic Limo controller</text>

  <rect class="camera" x="55" y="400" width="245" height="82"/>
  <text class="label" x="84" y="434">Attach front camera</text>
  <text class="small" x="84" y="460">uninavid_front_camera</text>

  <rect class="camera" x="370" y="400" width="245" height="82"/>
  <text class="label" x="402" y="434">Publish ROS 2 image</text>
  <text class="small" x="402" y="460">/camera/color/image_raw</text>

  <rect class="run" x="685" y="400" width="245" height="82"/>
  <text class="label" x="728" y="434">Timeline plays</text>
  <text class="small" x="728" y="460">ready for Uni-NaVid bridge</text>

  <path class="line" d="M 300 133 L 370 133"/>
  <path class="line" d="M 615 133 L 685 133"/>
  <path class="line" d="M 807 174 L 807 214 L 177 214 L 177 246"/>
  <path class="line" d="M 300 294 L 370 294"/>
  <path class="line" d="M 615 294 L 685 294"/>
  <path class="line" d="M 807 342 L 807 370 L 177 370 L 177 400"/>
  <path class="line" d="M 300 441 L 370 441"/>
  <path class="line" d="M 615 441 L 685 441"/>
</svg>
